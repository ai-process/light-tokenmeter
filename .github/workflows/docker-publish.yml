name: Publish Docker image

# Every pushed tag becomes an image on Docker Hub: coyl/light-tokenmeter:<tag>.
# Needs the repository secrets DOCKER_USERNAME and DOCKER_PASSWORD (an access token).
on:
  push:
    tags:
      - '*'

jobs:
  # No image is published unless earlier releases upgrade to this one.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Upgrade from earlier releases
        env:
          CUR: ${{ github.ref_name }}
        run: ./scripts/upgrade-test.sh

  publish:
    needs: upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: coyl/light-tokenmeter
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
