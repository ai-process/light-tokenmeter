name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs it as the release gate

jobs:
  test:
    runs-on: ubuntu-latest
    # Without the databases the storage tests skip, so CI provides both.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tokenmeter
          POSTGRES_PASSWORD: tokenmeter
          POSTGRES_DB: tokenmeter
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tokenmeter -d tokenmeter" --health-interval 2s --health-timeout 3s --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
          CLICKHOUSE_USER: tokenmeter
          CLICKHOUSE_PASSWORD: tokenmeter
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:8123/ping || exit 1" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run tests
        env:
          REQUIRE_DB: "1" # the Postgres and ClickHouse tests fail rather than skip
        run: go test -race ./...

  # A known vulnerability that our code reaches fails the build; one in a
  # dependency we never call is only reported.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # README "Versions and upgrades": the previous release and the oldest one of
  # the same major write Postgres and ClickHouse, this build must serve them,
  # and the old release must still serve on the migrated schema.
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the script picks the previous releases from the tags
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Upgrade from earlier releases
        env:
          CUR: ${{ github.ref_type == 'tag' && github.ref_name || '' }} # a release tag is not its own predecessor
        run: ./scripts/upgrade-test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
